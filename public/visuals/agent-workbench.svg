<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工作台四层架构</title><desc id="desc">上下文、规划、工具和审计四层架构图</desc>
  <rect width="1200" height="640" rx="36" fill="#f0fdf4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="600" y="80" text-anchor="middle" font-size="36" font-weight="700" fill="#14532d">Agent 工作台</text><text x="600" y="118" text-anchor="middle" font-size="20" fill="#166534">权限越接近外部世界，验证和审计越重要</text>
  <g transform="translate(120 185)"><rect width="960" height="78" rx="20" fill="#bbf7d0"/><text x="40" y="49" font-size="28" font-weight="700" fill="#14532d">上下文层</text><text x="300" y="49" font-size="21" fill="#166534">目标、规则、历史结果、当前状态</text></g>
  <g transform="translate(120 290)"><rect width="960" height="78" rx="20" fill="#86efac"/><text x="40" y="49" font-size="28" font-weight="700" fill="#14532d">规划层</text><text x="300" y="49" font-size="21" fill="#166534">步骤、依赖、验收标准、回滚点</text></g>
  <g transform="translate(120 395)"><rect width="960" height="78" rx="20" fill="#4ade80"/><text x="40" y="49" font-size="28" font-weight="700" fill="#14532d">工具层</text><text x="300" y="49" font-size="21" fill="#166534">白名单、参数校验、超时和权限边界</text></g>
  <g transform="translate(120 500)"><rect width="960" height="78" rx="20" fill="#16a34a"/><text x="40" y="49" font-size="28" font-weight="700" fill="#fff">审计层</text><text x="300" y="49" font-size="21" fill="#f0fdf4">输入摘要、决策、结果、异常和停止原因</text></g></g>
</svg>
