<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">长视频制作流水线</title><desc id="desc">内容、音频、画面、渲染验收四步流水线</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#faf5ff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient></defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="82" font-size="36" font-weight="700" fill="#581c87">长视频自动化流水线</text><text x="600" y="120" font-size="20" fill="#86198f">先把内容拆成可检查单元，再让工具接手重复劳动</text>
  <path d="M180 320h840" stroke="#a855f7" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 18"/>
  <g><rect x="80" y="205" width="220" height="220" rx="28" fill="#fff" stroke="#c084fc" stroke-width="4"/><text x="190" y="282" font-size="31" font-weight="700" fill="#6b21a8">内容</text><text x="190" y="330" font-size="20" fill="#86198f">章节、场景、结论</text><text x="190" y="365" font-size="20" fill="#86198f">先过事实核对</text></g>
  <g><rect x="325" y="205" width="220" height="220" rx="28" fill="#fff" stroke="#c084fc" stroke-width="4"/><text x="435" y="282" font-size="31" font-weight="700" fill="#6b21a8">音频</text><text x="435" y="330" font-size="20" fill="#86198f">术语、停顿、授权</text><text x="435" y="365" font-size="20" fill="#86198f">听感与字幕同步</text></g>
  <g><rect x="570" y="205" width="220" height="220" rx="28" fill="#fff" stroke="#c084fc" stroke-width="4"/><text x="680" y="282" font-size="31" font-weight="700" fill="#6b21a8">画面</text><text x="680" y="330" font-size="20" fill="#86198f">标题、示意、重点词</text><text x="680" y="365" font-size="20" fill="#86198f">每个元素服务理解</text></g>
  <g><rect x="815" y="205" width="220" height="220" rx="28" fill="#fff" stroke="#c084fc" stroke-width="4"/><text x="925" y="282" font-size="31" font-weight="700" fill="#6b21a8">验收</text><text x="925" y="330" font-size="20" fill="#86198f">字幕、音量、断句</text><text x="925" y="365" font-size="20" fill="#86198f">渲染后逐段复查</text></g>
  <text x="600" y="520" font-size="24" fill="#86198f">自动化的终点不是渲染成功，而是观众能顺畅理解</text></g>
</svg>
