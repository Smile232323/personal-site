<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Codex 网络排障分层图</title>
  <desc id="desc">进程、网络、鉴权和工具四层从左到右连接的示意图</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <path d="M170 320h860" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 20"/>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle">
    <g transform="translate(80 155)"><rect width="220" height="330" rx="28" fill="#fff"/><circle cx="110" cy="80" r="42" fill="#4f46e5"/><path d="M88 80h44M110 58v44" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="110" y="178" font-size="32" font-weight="700" fill="#0f172a">进程层</text><text x="110" y="220" font-size="20" fill="#475569">从哪里启动</text><text x="110" y="252" font-size="20" fill="#475569">继承了什么环境</text></g>
    <g transform="translate(350 155)"><rect width="220" height="330" rx="28" fill="#fff"/><circle cx="110" cy="80" r="42" fill="#0891b2"/><path d="M86 80h48M110 56v48" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="110" y="178" font-size="32" font-weight="700" fill="#0f172a">网络层</text><text x="110" y="220" font-size="20" fill="#475569">代理是否生效</text><text x="110" y="252" font-size="20" fill="#475569">目标是否可达</text></g>
    <g transform="translate(620 155)"><rect width="220" height="330" rx="28" fill="#fff"/><circle cx="110" cy="80" r="42" fill="#ea580c"/><path d="M90 76l20-20 20 20M110 56v52" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="110" y="178" font-size="32" font-weight="700" fill="#0f172a">鉴权层</text><text x="110" y="220" font-size="20" fill="#475569">账号与 provider</text><text x="110" y="252" font-size="20" fill="#475569">额度和权限</text></g>
    <g transform="translate(890 155)"><rect width="220" height="330" rx="28" fill="#fff"/><circle cx="110" cy="80" r="42" fill="#16a34a"/><path d="M90 80h40M110 60v40" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="110" y="178" font-size="32" font-weight="700" fill="#0f172a">工具层</text><text x="110" y="220" font-size="20" fill="#475569">项目与 SSH</text><text x="110" y="252" font-size="20" fill="#475569">测试与远程服务</text></g>
  </g>
  <text x="600" y="570" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" fill="#475569">一次只验证一层，排障记录才会变成可复用的方法</text>
</svg>
