<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AI 辅助科研流程图</title><desc id="desc">检索、精读、实验和审阅组成的科研闭环</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fef2f2"/></linearGradient></defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="82" font-size="36" font-weight="700" fill="#431407">AI 辅助科研的证据闭环</text><text x="600" y="120" font-size="20" fill="#7c2d12">模型负责整理与追问，人负责核验与判断</text>
  <path d="M220 300C300 180 420 180 500 300S700 420 780 300s200-120 280 0" fill="none" stroke="#fb923c" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 18"/>
  <g><rect x="100" y="215" width="220" height="170" rx="26" fill="#fff" stroke="#fdba74" stroke-width="4"/><text x="210" y="275" font-size="30" font-weight="700" fill="#9a3412">检索</text><text x="210" y="320" font-size="20" fill="#57534e">扩展关键词</text><text x="210" y="350" font-size="20" fill="#57534e">回到数据库核对</text></g>
  <g><rect x="345" y="215" width="220" height="170" rx="26" fill="#fff" stroke="#fdba74" stroke-width="4"/><text x="455" y="275" font-size="30" font-weight="700" fill="#9a3412">精读</text><text x="455" y="320" font-size="20" fill="#57534e">拆贡献与假设</text><text x="455" y="350" font-size="20" fill="#57534e">定位图表与附录</text></g>
  <g><rect x="590" y="215" width="220" height="170" rx="26" fill="#fff" stroke="#fdba74" stroke-width="4"/><text x="700" y="275" font-size="30" font-weight="700" fill="#9a3412">实验</text><text x="700" y="320" font-size="20" fill="#57534e">固定变量</text><text x="700" y="350" font-size="20" fill="#57534e">保留可复现记录</text></g>
  <g><rect x="835" y="215" width="220" height="170" rx="26" fill="#fff" stroke="#fdba74" stroke-width="4"/><text x="945" y="275" font-size="30" font-weight="700" fill="#9a3412">审阅</text><text x="945" y="320" font-size="20" fill="#57534e">反例与局限</text><text x="945" y="350" font-size="20" fill="#57534e">引用逐条复核</text></g>
  <text x="600" y="520" font-size="24" fill="#7c2d12">每一轮输出都要留下来源、假设和下一步验证动作</text></g>
</svg>
