<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">视觉模型输入链路</title><desc id="desc">图片预处理、观察提示和结果复核三步链路</desc>
  <rect width="1200" height="640" rx="36" fill="#ecfeff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="84" font-size="36" font-weight="700" fill="#164e63">让模型看图的三步链路</text><text x="600" y="122" font-size="20" fill="#155e75">图像清晰只是起点，证据和不确定性也要被写进提示</text>
  <path d="M300 320h600" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-dasharray="16 18"/>
  <g><rect x="100" y="210" width="260" height="220" rx="28" fill="#fff" stroke="#22d3ee" stroke-width="5"/><circle cx="230" cy="278" r="45" fill="#cffafe"/><path d="M205 292l22-24 18 18 20-26" fill="none" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/><text x="230" y="360" font-size="28" font-weight="700" fill="#155e75">预处理</text><text x="230" y="394" font-size="18" fill="#0e7490">方向、尺寸、清晰度</text></g>
  <g><rect x="470" y="210" width="260" height="220" rx="28" fill="#fff" stroke="#22d3ee" stroke-width="5"/><circle cx="600" cy="278" r="45" fill="#cffafe"/><path d="M575 278h50M600 253v50" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/><text x="600" y="360" font-size="28" font-weight="700" fill="#155e75">观察任务</text><text x="600" y="394" font-size="18" fill="#0e7490">范围、证据、不确定性</text></g>
  <g><rect x="840" y="210" width="260" height="220" rx="28" fill="#fff" stroke="#22d3ee" stroke-width="5"/><circle cx="970" cy="278" r="45" fill="#cffafe"/><path d="M945 280l18 18 34-42" fill="none" stroke="#0891b2" stroke-width="8" stroke-linecap="round"/><text x="970" y="360" font-size="28" font-weight="700" fill="#155e75">结果复核</text><text x="970" y="394" font-size="18" fill="#0e7490">回到原图和原始数据</text></g></g>
</svg>
