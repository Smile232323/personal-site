<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AI 协作闭环</title><desc id="desc">入口、澄清、执行、人工复核和减法复盘组成 AI 协作闭环</desc>
  <rect width="1200" height="640" rx="36" fill="#f5f3ff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="600" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#312e81">把 AI 当协作者，而不是自动售货机</text><text x="600" y="112" text-anchor="middle" font-size="20" fill="#4c1d95">入口越近，越要把问题定义权和验收权留在人手里</text>
  <path d="M600 164a190 190 0 1 1-134 56" fill="none" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 18"/>
  <g text-anchor="middle"><g transform="translate(490 145)"><rect width="220" height="100" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="110" y="43" font-size="27" font-weight="700" fill="#5b21b6">低摩擦入口</text><text x="110" y="75" font-size="18" fill="#6d28d9">划词 / IM / 工作台</text></g>
  <g transform="translate(820 260)"><rect width="220" height="100" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="110" y="43" font-size="27" font-weight="700" fill="#5b21b6">共同澄清</text><text x="110" y="75" font-size="18" fill="#6d28d9">追问 / 原型 / 取舍</text></g>
  <g transform="translate(490 455)"><rect width="220" height="100" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="110" y="43" font-size="27" font-weight="700" fill="#5b21b6">人工验收</text><text x="110" y="75" font-size="18" fill="#6d28d9">事实 / 代码 / 逻辑</text></g>
  <g transform="translate(140 260)"><rect width="220" height="100" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="110" y="43" font-size="27" font-weight="700" fill="#5b21b6">减法复盘</text><text x="110" y="75" font-size="18" fill="#6d28d9">关掉重复 Skill</text></g></g>
  <text x="600" y="610" text-anchor="middle" font-size="22" fill="#4c1d95">产出变多不等于判断变准；没有验收标准时，先暂停自动化</text></g>
</svg>
