<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">本地推理评测指标</title><desc id="desc">首 token 延迟、生成速度、上下文、显存和稳定性五个指标</desc>
  <rect width="1200" height="640" rx="36" fill="#f5f3ff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="84" font-size="36" font-weight="700" fill="#312e81">本地推理不能只看 token 每秒</text><text x="600" y="122" font-size="20" fill="#4338ca">把交互速度、资源余量和长时间稳定性一起测</text>
  <g transform="translate(120 205)"><rect width="180" height="220" rx="26" fill="#fff" stroke="#a78bfa" stroke-width="5"/><text x="90" y="82" font-size="29" font-weight="700" fill="#4338ca">首 token</text><text x="90" y="130" font-size="18" fill="#6366f1">等待感</text><path d="M45 175h90" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(345 205)"><rect width="180" height="220" rx="26" fill="#fff" stroke="#a78bfa" stroke-width="5"/><text x="90" y="82" font-size="29" font-weight="700" fill="#4338ca">生成速度</text><text x="90" y="130" font-size="18" fill="#6366f1">长回答</text><path d="M45 175h130" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(570 205)"><rect width="180" height="220" rx="26" fill="#fff" stroke="#a78bfa" stroke-width="5"/><text x="90" y="82" font-size="29" font-weight="700" fill="#4338ca">上下文</text><text x="90" y="130" font-size="18" fill="#6366f1">真实材料</text><path d="M45 175h100" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(795 205)"><rect width="180" height="220" rx="26" fill="#fff" stroke="#a78bfa" stroke-width="5"/><text x="90" y="82" font-size="29" font-weight="700" fill="#4338ca">显存余量</text><text x="90" y="130" font-size="18" fill="#6366f1">是否换入换出</text><path d="M45 175h80" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(1000 205)"><rect width="180" height="220" rx="26" fill="#fff" stroke="#a78bfa" stroke-width="5"/><text x="90" y="82" font-size="27" font-weight="700" fill="#4338ca">稳定性</text><text x="90" y="130" font-size="18" fill="#6366f1">长时间运行</text><path d="M45 175h120" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/></g>
  <text x="600" y="520" font-size="24" fill="#4338ca">固定模型、量化、上下文和并发条件，结果才有可比性</text></g>
</svg>
