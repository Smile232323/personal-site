<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">教育 AI 产品观察框架</title><desc id="desc">场景、质量、可控性和长期指标四步评估框架</desc>
  <rect width="1200" height="640" rx="36" fill="#ecfdf5"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="84" font-size="36" font-weight="700" fill="#064e3b">教育 AI 产品的四个问题</text><text x="600" y="122" font-size="20" fill="#047857">从真实流程出发，别让“能生成”代替需求验证</text>
  <g><rect x="100" y="215" width="220" height="190" rx="28" fill="#fff" stroke="#34d399" stroke-width="5"/><text x="210" y="290" font-size="29" font-weight="700" fill="#065f46">场景</text><text x="210" y="335" font-size="19" fill="#047857">谁在何时卡住</text><text x="210" y="368" font-size="19" fill="#047857">替代方案是什么</text></g>
  <g><rect x="345" y="215" width="220" height="190" rx="28" fill="#fff" stroke="#34d399" stroke-width="5"/><text x="455" y="290" font-size="29" font-weight="700" fill="#065f46">质量</text><text x="455" y="335" font-size="19" fill="#047857">准确、适龄、可解释</text><text x="455" y="368" font-size="19" fill="#047857">错误如何反馈</text></g>
  <g><rect x="590" y="215" width="220" height="190" rx="28" fill="#fff" stroke="#34d399" stroke-width="5"/><text x="700" y="290" font-size="29" font-weight="700" fill="#065f46">可控</text><text x="700" y="335" font-size="19" fill="#047857">教师能否修改</text><text x="700" y="368" font-size="19" fill="#047857">结果能否追溯</text></g>
  <g><rect x="835" y="215" width="220" height="190" rx="28" fill="#fff" stroke="#34d399" stroke-width="5"/><text x="945" y="290" font-size="29" font-weight="700" fill="#065f46">指标</text><text x="945" y="335" font-size="19" fill="#047857">使用、修改、复用</text><text x="945" y="368" font-size="19" fill="#047857">错误反馈趋势</text></g>
  <text x="600" y="520" font-size="24" fill="#047857">真正的价值，是让教师把时间还给判断、反馈和关系</text></g>
</svg>
