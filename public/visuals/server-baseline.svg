<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">新服务器安全基线</title><desc id="desc">账户、更新、暴露面、日志和备份五个检查块</desc>
  <rect width="1200" height="640" rx="36" fill="#eff6ff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="84" font-size="36" font-weight="700" fill="#172554">新服务器开工前的五个检查块</text><text x="600" y="122" font-size="20" fill="#1e40af">先建立可恢复的基础，再部署业务服务</text>
  <g transform="translate(110 210)"><circle cx="90" cy="90" r="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="6"/><text x="90" y="83" font-size="28" font-weight="700" fill="#1e3a8a">账户</text><text x="90" y="118" font-size="18" fill="#1e40af">SSH 与权限</text></g>
  <g transform="translate(330 210)"><circle cx="90" cy="90" r="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="6"/><text x="90" y="83" font-size="28" font-weight="700" fill="#1e3a8a">更新</text><text x="90" y="118" font-size="18" fill="#1e40af">补丁与依赖</text></g>
  <g transform="translate(550 210)"><circle cx="90" cy="90" r="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="6"/><text x="90" y="83" font-size="28" font-weight="700" fill="#1e3a8a">暴露面</text><text x="90" y="118" font-size="18" fill="#1e40af">端口与防火墙</text></g>
  <g transform="translate(770 210)"><circle cx="90" cy="90" r="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="6"/><text x="90" y="83" font-size="28" font-weight="700" fill="#1e3a8a">日志</text><text x="90" y="118" font-size="18" fill="#1e40af">登录与异常</text></g>
  <g transform="translate(990 210)"><circle cx="90" cy="90" r="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="6"/><text x="90" y="83" font-size="28" font-weight="700" fill="#1e3a8a">备份</text><text x="90" y="118" font-size="18" fill="#1e40af">恢复演练</text></g>
  <path d="M190 435h820" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><text x="600" y="515" font-size="25" fill="#1e3a8a">每一项都写下用途、负责人、检查时间和回滚方式</text></g>
</svg>
