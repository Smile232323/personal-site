<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Codex 排障时间线</title><desc id="desc">从浏览器正常到代理变量被删除、恢复后进入 provider 鉴权排查的时间线</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient></defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="600" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#172554">一次 Codex 失败，实际经过了两种故障</text><text x="600" y="112" text-anchor="middle" font-size="20" fill="#475569">先定位进程继承的环境，再区分网络和 provider 鉴权</text>
  <path d="M150 310H1050" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/><g text-anchor="middle">
    <g transform="translate(90 188)"><circle cx="90" cy="122" r="42" fill="#2563eb"/><text x="90" y="132" font-size="26" font-weight="700" fill="#fff">1</text><text x="90" y="195" font-size="25" font-weight="700" fill="#0f172a">浏览器正常</text><text x="90" y="232" font-size="18" fill="#475569">终端里的 Codex 失败</text></g>
    <g transform="translate(315 188)"><circle cx="90" cy="122" r="42" fill="#ea580c"/><text x="90" y="132" font-size="26" font-weight="700" fill="#fff">2</text><text x="90" y="195" font-size="25" font-weight="700" fill="#0f172a">入口清理代理</text><text x="90" y="232" font-size="18" fill="#475569">shell 函数删除环境变量</text></g>
    <g transform="translate(540 188)"><circle cx="90" cy="122" r="42" fill="#16a34a"/><text x="90" y="132" font-size="26" font-weight="700" fill="#fff">3</text><text x="90" y="195" font-size="25" font-weight="700" fill="#0f172a">恢复继承关系</text><text x="90" y="232" font-size="18" fill="#475569">请求重新经过代理</text></g>
    <g transform="translate(765 188)"><circle cx="90" cy="122" r="42" fill="#7c3aed"/><text x="90" y="132" font-size="26" font-weight="700" fill="#fff">4</text><text x="90" y="195" font-size="25" font-weight="700" fill="#0f172a">暴露新错误</text><text x="90" y="232" font-size="18" fill="#475569">provider / 额度 / 权限</text></g>
  </g><rect x="140" y="430" width="920" height="86" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="600" y="482" text-anchor="middle" font-size="24" fill="#334155">网络连通 ≠ provider 可用：错误变化本身就是定位证据</text></g>
</svg>
