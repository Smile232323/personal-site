<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">博客发布队列</title><desc id="desc">草稿、核验、排期、发布四个状态的内容队列</desc>
  <rect width="1200" height="640" rx="36" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><text x="600" y="84" font-size="36" font-weight="700" fill="#0f172a">把一次性整理变成发布队列</text><text x="600" y="122" font-size="20" fill="#334155">状态、来源时间和下一次复查共同决定一篇内容是否能上线</text>
  <path d="M190 330h820" stroke="#64748b" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 18"/>
  <g><circle cx="180" cy="330" r="70" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/><text x="180" y="322" font-size="27" font-weight="700" fill="#334155">草稿</text><text x="180" y="354" font-size="17" fill="#475569">事实待核验</text></g>
  <g><circle cx="460" cy="330" r="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="5"/><text x="460" y="322" font-size="27" font-weight="700" fill="#1e3a8a">核验</text><text x="460" y="354" font-size="17" fill="#1d4ed8">来源与边界</text></g>
  <g><circle cx="740" cy="330" r="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/><text x="740" y="322" font-size="27" font-weight="700" fill="#78350f">排期</text><text x="740" y="354" font-size="17" fill="#92400e">选择公开时间</text></g>
  <g><circle cx="1020" cy="330" r="70" fill="#dcfce7" stroke="#22c55e" stroke-width="5"/><text x="1020" y="322" font-size="27" font-weight="700" fill="#14532d">发布</text><text x="1020" y="354" font-size="17" fill="#166534">构建与复查</text></g>
  <text x="600" y="520" font-size="24" fill="#334155">每篇文章都留下“为什么现在公开”和“何时重新检查”</text></g>
</svg>
