<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Tailscale 与代理路由案例</title><desc id="desc">公网、Tailscale 私网和本地网在代理中的分流与验证顺序</desc>
  <rect width="1200" height="640" rx="36" fill="#ecfeff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="600" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#164e63">两个客户端都显示已连接，不代表路由正确</text><text x="600" y="112" text-anchor="middle" font-size="20" fill="#155e75">先确认目标地址命中哪条路，再用真实业务端口验收</text>
  <g text-anchor="middle"><rect x="70" y="205" width="240" height="180" rx="28" fill="#fff" stroke="#67e8f9" stroke-width="4"/><text x="190" y="265" font-size="30" font-weight="700" fill="#0e7490">公网</text><text x="190" y="310" font-size="20" fill="#155e75">域名 / HTTPS</text><text x="190" y="345" font-size="18" fill="#475569">代理出口</text>
  <rect x="480" y="205" width="240" height="180" rx="28" fill="#fff" stroke="#22d3ee" stroke-width="4"/><text x="600" y="265" font-size="30" font-weight="700" fill="#0e7490">Tailnet</text><text x="600" y="310" font-size="20" fill="#155e75">100.64.0.0/10</text><text x="600" y="345" font-size="18" fill="#475569">组网隧道</text>
  <rect x="890" y="205" width="240" height="180" rx="28" fill="#fff" stroke="#67e8f9" stroke-width="4"/><text x="1010" y="265" font-size="30" font-weight="700" fill="#0e7490">本地网</text><text x="1010" y="310" font-size="20" fill="#155e75">局域网设备</text><text x="1010" y="345" font-size="18" fill="#475569">直连或明确转发</text></g>
  <path d="M310 295h170M720 295h170" stroke="#0891b2" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 18"/><rect x="170" y="465" width="860" height="80" rx="22" fill="#fff" stroke="#a5f3fc" stroke-width="3"/><text x="600" y="515" text-anchor="middle" font-size="23" fill="#155e75">DNS → 路由 → 端口 → TLS → 应用：ping 失败不能替代这条验收链</text></g>
</svg>
